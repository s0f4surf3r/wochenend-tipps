<meta name="theme-color" content="#f2f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121c17" media="(prefers-color-scheme: dark)">
<style>
/* Layout: eine ruhige Spalte wie ein Fahrplan-Aushang – Kopf mit Wetter, drei große Tipp-Karten, darunter kompakte Liste, Archiv eingeklappt. */
:root {
  --bg: #f2f4ee;          /* Parkweg-Grau mit Grünstich */
  --surface: #ffffff;
  --ink: #1d3328;         /* Waldgrün, Text */
  --muted: #5b6e63;
  --line: #d9dfd4;
  --accent: #f2b705;      /* Bahnsteig-Gelb */
  --accent-ink: #2a2100;
  --ok: #2f8a4c; --mid: #b7791f; --hot: #c2412d;
  --display: ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --r-card: 14px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121c17; --surface: #1a2721; --ink: #e8efe9; --muted: #9fb2a6; --line: #2c3c34;
  --accent: #f5c431; --accent-ink: #231b00; --ok: #5cc27e; --mid: #e0a64a; --hot: #ee7a63; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121c17; --surface: #1a2721; --ink: #e8efe9; --muted: #9fb2a6; --line: #2c3c34;
  --accent: #f5c431; --accent-ink: #231b00; --ok: #5cc27e; --mid: #e0a64a; --hot: #ee7a63; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 32px; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header { display: grid; gap: 12px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-size: clamp(30px, 7vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; font-weight: 800; }
.kurz { margin: 0; font-size: 18px; max-width: 60ch; }
.wetter { display: flex; flex-wrap: wrap; gap: 8px; }
.wetter span { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 6px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }

h2 { font-family: var(--display); font-size: 22px; margin: 0; font-weight: 700; }
section { display: grid; gap: 16px; }

.top { display: grid; gap: 16px; }
.karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; gap: 12px; min-width: 0; }
.kopf { display: flex; gap: 12px; align-items: flex-start; }
.nr { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; display: grid; place-items: center; font-size: 18px; }
.karte h3 { font-family: var(--display); font-size: 21px; line-height: 1.25; margin: 4px 0 0; text-wrap: balance; }
.wann { font-weight: 600; font-variant-numeric: tabular-nums; }
.ort { color: var(--muted); margin: 0; }
.warum { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; border-radius: var(--r-pill); padding: 4px 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.chip.frei { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.chip.reiz::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c); }
.chip.gruen { --c: var(--ok); } .chip.gelb { --c: var(--mid); } .chip.rot { --c: var(--hot); }
.hinweis { font-size: 14px; color: var(--mid); margin: 0; }
.tipp-reiz { font-size: 15px; color: var(--muted); margin: 0; }
.aktionen { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid var(--line); }
.btn.haupt { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (hover: hover) { .btn:hover { filter: brightness(.96); } }
.btn:active { transform: translateY(1px); }

.liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.liste li { padding: 14px 16px; display: grid; grid-template-columns: 28px 1fr; gap: 4px 12px; border-top: 1px solid var(--line); min-width: 0; }
.liste li:first-child { border-top: 0; }
.liste .n { font-family: var(--display); font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.liste .t { font-weight: 600; }
.liste .t a { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.liste .m { grid-column: 2; color: var(--muted); font-size: 15px; }

.feedback { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-card); padding: 16px 20px; font-size: 15px; }
.feedback p { margin: 0; }
details { border-top: 1px solid var(--line); padding-top: 16px; }
summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 18px; min-height: 44px; display: flex; align-items: center; }
.archiv { display: grid; gap: 16px; margin-top: 8px; }
.archiv h4 { margin: 0 0 4px; font-size: 16px; }
.archiv ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>

<script>
(function () {
  var d;
  try { d = JSON.parse(document.getElementById('daten').textContent); } catch (e) { document.getElementById('titel').textContent = 'Daten fehlen'; return; }
  var a = d.aktuell || {};
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function link(href, cls, text) { var x = el('a', cls, text); x.href = href; x.target = '_blank'; x.rel = 'noopener'; return x; }
  var WEG = { nah: 'nah · auch mit eigenem Rad', kindersitz: 'Kindersitz', weit: 'weiter weg' };
  var REIZ = { gruen: 'ruhig', gelb: 'mittel', rot: 'laut & voll' };

  document.getElementById('eyebrow').textContent = a.eyebrow || 'Wochenend-Tipps';
  document.getElementById('titel').textContent = a.titel || '';
  document.getElementById('kurz').textContent = a.kurz || '';
  var w = document.getElementById('wetter');
  (a.wetter || []).forEach(function (t) { w.appendChild(el('span', null, t.tag + ' ' + t.temp + ' °C · ' + t.text)); });

  function chips(t) {
    var c = el('div', 'chips');
    if (t.kosten) c.appendChild(el('span', 'chip' + (t.frei ? ' frei' : ''), t.kosten));
    if (t.weg) c.appendChild(el('span', 'chip', '🚲 ' + (t.weg.minuten ? 'ca. ' + t.weg.minuten + ' Min · ' : '') + (WEG[t.weg.art] || t.weg.art)));
    if (t.reiz) c.appendChild(el('span', 'chip reiz ' + t.reiz, REIZ[t.reiz] || t.reiz));
    return c;
  }
  var top = document.getElementById('top');
  (a.top || []).forEach(function (t) {
    var k = el('article', 'karte');
    var kopf = el('div', 'kopf'); kopf.appendChild(el('div', 'nr', t.nr));
    var tt = el('div'); tt.style.minWidth = '0';
    tt.appendChild(el('div', 'wann', t.wann)); tt.appendChild(el('h3', null, t.titel)); kopf.appendChild(tt); k.appendChild(kopf);
    if (t.ort) k.appendChild(el('p', 'ort', t.ort));
    k.appendChild(chips(t));
    if (t.warum) k.appendChild(el('p', 'warum', t.warum));
    if (t.reiz_tipp) k.appendChild(el('p', 'tipp-reiz', t.reiz_tipp));
    if (t.hinweis) k.appendChild(el('p', 'hinweis', '⚠ ' + t.hinweis));
    var ak = el('div', 'aktionen');
    if (t.link) ak.appendChild(link(t.link, 'btn haupt', 'Zur Veranstaltung'));
    if (t.adresse) ak.appendChild(link('https://www.google.com/maps/dir/?api=1&travelmode=bicycling&destination=' + encodeURIComponent(t.adresse), 'btn', 'Route mit dem Rad'));

    var ti = el('span', 't'); if (t.link) ti.appendChild(link(t.link, null, t.titel)); else ti.textContent = t.titel; li.appendChild(ti);
    var meta = [t.wann, t.ort, t.kosten].filter(Boolean).join(' · ');
    if (t.hinweis) meta += ' · ⚠ ' + t.hinweis;
    li.appendChild(el('span', 'm', meta)); mehr.appendChild(li);
  });
  if (!(a.weitere || []).length) document.getElementById('mehr-sec').hidden = true;
  var ar = document.getElementById('archiv');
  (d.archiv || []).forEach(function (w) {
    var b = el('div'); b.appendChild(el('h4', null, w.titel)); var ul = el('ul');
    (w.tipps || []).forEach(function (t) { ul.appendChild(el('li', null, t)); }); b.appendChild(ul); ar.appendChild(b);
  });

})();
