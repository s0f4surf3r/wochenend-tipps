/* Layout: eine ruhige Spalte wie ein Fahrplan-Aushang – Kopf mit Wetter, drei große Tipp-Karten, darunter kompakte Liste, Archiv eingeklappt. */
:root {

  --surface: #ffffff;
  --ink: #1d3328;         /* Waldgrün, Text */

  --line: #d9dfd4;

  --r-card: 14px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121c17; --surface: #1a2721; --ink: #e8efe9; --muted: #9fb2a6; --line: #2c3c34;
  --accent: #f5c431; --accent-ink: #231b00; --ok: #5cc27e; --mid: #e0a64a; --hot: #ee7a63; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121c17; --surface: #1a2721; --ink: #e8efe9; --muted: #9fb2a6; --line: #2c3c34;
  --accent: #f5c431; --accent-ink: #231b00; --ok: #5cc27e; --mid: #e0a64a; --hot: #ee7a63; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 32px; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header { display: grid; gap: 12px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-size: clamp(30px, 7vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; font-weight: 800; }
.kurz { margin: 0; font-size: 18px; max-width: 60ch; }
.kopfbild { display: block; margin-bottom: 8px; }
.kopfbild img { display: block; width: 100%; height: auto; border-radius: var(--r-card); background: #c9d3bd; }

:root[data-theme="dark"] .kopfbild img { filter: brightness(.85); }
.wetter span, .wann, .karte h3, .ort, .warum, .liste .m { overflow-wrap: anywhere; }
.wetter { display: flex; flex-wrap: wrap; gap: 8px; }
.wetter span { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 6px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }

h2 { font-family: var(--display); font-size: 22px; margin: 0; font-weight: 700; }
section { display: grid; gap: 16px; }

.top { display: grid; gap: 16px; }
.karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.kopf { display: flex; gap: 12px; align-items: flex-start; }
.nr { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800; display: grid; place-items: center; font-size: 18px; }
.karte h3 { font-family: var(--display); font-size: 21px; line-height: 1.25; margin: 4px 0 0; text-wrap: balance; }
.wann { font-weight: 600; font-variant-numeric: tabular-nums; }
.ort { color: var(--muted); margin: 0; }
.warum { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; border-radius: 14px; padding: 4px 10px; border: 1px solid var(--line); background: var(--bg); max-width: 100%; overflow-wrap: anywhere; }
.chip.frei { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.chip.reiz::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c); }
.chip.gruen { --c: var(--ok); } .chip.gelb { --c: var(--mid); } .chip.rot { --c: var(--hot); }
.hinweis { font-size: 14px; color: var(--mid); margin: 0; }
.tipp-reiz { font-size: 15px; color: var(--muted); margin: 0; }
.aktionen { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid var(--line); }
.btn.haupt { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (hover: hover) { .btn:hover { filter: brightness(.96); } }
.btn:active { transform: translateY(1px); }

.liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.liste li { padding: 14px 16px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 12px; border-top: 1px solid var(--line); min-width: 0; }
.liste li:first-child { border-top: 0; }
.liste .n { font-family: var(--display); font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.liste .t { font-weight: 600; }
.liste .t a { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.liste .m { grid-column: 2; color: var(--muted); font-size: 15px; }
.liste.kino li { grid-template-columns: minmax(0, 1fr); }
.liste.kino .m { grid-column: 1; }
.liste.kino .zeiten { display: grid; gap: 2px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tag-reihe { padding-bottom: 10px; border-bottom: 1px solid var(--line); }

.feedback { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-card); padding: 16px 20px; font-size: 15px; }
.feedback p { margin: 0; }
details { border-top: 1px solid var(--line); padding-top: 16px; }
summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 18px; min-height: 44px; display: flex; align-items: center; }
.archiv { display: grid; gap: 16px; margin-top: 8px; }
.archiv h4 { margin: 0 0 4px; font-size: 16px; }
.archiv ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
footer { color: var(--muted); font-size: 13px; }
.filter { display: grid; gap: 10px; }
.filter-reihe { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { font: inherit; font-size: 15px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (hover: hover) { .fchip:hover { border-color: var(--ink); } }
.fchip:active { transform: translateY(1px); }
.filter-info { font-size: 14px; color: var(--muted); margin: 0; }
.filter-info button { font: inherit; color: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
.leer { color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
(function () {
  var d;
  try { d = JSON.parse(document.getElementById('daten').textContent); } catch (e) { document.getElementById('titel').textContent = 'Daten fehlen'; return; }
  var a = d.aktuell || {};
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function link(href, cls, text) { var x = el('a', cls, text); x.href = href; x.target = '_blank'; x.rel = 'noopener'; return x; }
  var WEG = { nah: 'nah · auch mit eigenem Rad', kindersitz: 'Kindersitz', weit: 'weiter weg' };
  var REIZ = { gruen: 'ruhig', gelb: 'mittel', rot: 'laut & voll' };

  document.getElementById('eyebrow').textContent = a.eyebrow || 'Wochenend-Tipps';
  document.getElementById('titel').textContent = a.titel || '';
  var w = document.getElementById('wetter');
  (a.wetter || []).forEach(function (t) { w.appendChild(el('span', null, t.tag + ' ' + t.temp + ' °C · ' + t.text)); });

  function chips(t) {
    var c = el('div', 'chips');
    if (t.kosten) c.appendChild(el('span', 'chip' + (t.frei ? ' frei' : ''), t.kosten));
    if (t.weg) c.appendChild(el('span', 'chip', '🚲 ' + (t.weg.minuten ? 'ca. ' + t.weg.minuten + ' Min · ' : '') + (WEG[t.weg.art] || t.weg.art)));
    if (t.reiz) c.appendChild(el('span', 'chip reiz ' + t.reiz, REIZ[t.reiz] || t.reiz));
    return c;
  }
  // Tag aus "wann" ableiten: "Sa …" → sa, "So …" → so, beides oder keins (z. B. "jederzeit") → beide
  function tage(t) {
    if (t.tage && t.tage.length) return t.tage;
    var w = t.wann || '', sa = /\bSa\b/.test(w), so = /\bSo\b/.test(w);
    return sa || so ? [sa && 'sa', so && 'so'].filter(Boolean) : ['sa', 'so'];
  }
  // Bei gewähltem Tag nur die passenden Zeitangaben zeigen ("Sa 14 Uhr · So 12 Uhr" → "So 12 Uhr")
  function zeiten(t, tag) {
    var teile = (t.wann || '').split(' · ');
    if (!tag) return teile;
    var anders = tag === 'sa' ? /\bSo\b/ : /\bSa\b/, eigen = tag === 'sa' ? /\bSa\b/ : /\bSo\b/;
    var rest = teile.filter(function (s) { return eigen.test(s) || !anders.test(s); });
    return rest.length ? rest : teile;
  }
  var eintraege = [];
  var top = document.getElementById('top');
  (a.top || []).forEach(function (t) {
    var k = el('article', 'karte');
    var kopf = el('div', 'kopf'); kopf.appendChild(el('div', 'nr', t.nr));
    var tt = el('div'); tt.style.minWidth = '0';
    var wann = el('div', 'wann', t.wann);
    tt.appendChild(wann); tt.appendChild(el('h3', null, t.titel)); kopf.appendChild(tt); k.appendChild(kopf);
    if (t.ort) k.appendChild(el('p', 'ort', t.ort));
    k.appendChild(chips(t));
    if (t.warum) k.appendChild(el('p', 'warum', t.warum));
    if (t.reiz_tipp) k.appendChild(el('p', 'tipp-reiz', t.reiz_tipp));
    if (t.hinweis) k.appendChild(el('p', 'hinweis', '⚠ ' + t.hinweis));
    var ak = el('div', 'aktionen');
    if (t.link) ak.appendChild(link(t.link, 'btn haupt', 'Zur Veranstaltung'));
    if (t.adresse) ak.appendChild(link('https://www.google.com/maps/dir/?api=1&travelmode=bicycling&destination=' + encodeURIComponent(t.adresse), 'btn', 'Route mit dem Rad'));
    k.appendChild(ak);
    top.appendChild(k);
    eintraege.push({ el: k, t: t, liste: 'top', zeige: function (tag) { wann.textContent = zeiten(t, tag).join(' · '); } });
  });
  var mehr = document.getElementById('mehr');
  (a.weitere || []).forEach(function (t) {
    var li = el('li'); li.appendChild(el('span', 'n', t.nr));
    var ti = el('span', 't'); if (t.link) ti.appendChild(link(t.link, null, t.titel)); else ti.textContent = t.titel; li.appendChild(ti);
    var m = el('span', 'm'); li.appendChild(m); mehr.appendChild(li);
    var zeige = function (tag) {
      var meta = [zeiten(t, tag).join(' · '), t.ort, t.kosten].filter(Boolean).join(' · ');
      m.textContent = t.hinweis ? meta + ' · ⚠ ' + t.hinweis : meta;
    };
    zeige(null);
    eintraege.push({ el: li, t: t, liste: 'mehr', zeige: zeige });
  });
  if (!(a.weitere || []).length) document.getElementById('mehr-sec').hidden = true;
  // Kino: Zeiten pro Tag in eigener Zeile, damit Sa und So gleich sichtbar sind
  var kino = document.getElementById('kino');
  (a.kino || []).forEach(function (t) {
    var li = el('li');
    var ti = el('span', 't'); if (t.link) ti.appendChild(link(t.link, null, t.titel)); else ti.textContent = t.titel; li.appendChild(ti);
    var z = el('span', 'zeiten'); li.appendChild(z);
    var meta = [t.ort, t.kosten].filter(Boolean).join(' · ');
    if (t.hinweis) meta += (meta ? ' · ' : '') + t.hinweis;
    if (meta) li.appendChild(el('span', 'm', meta));
    kino.appendChild(li);
    var zeige = function (tag) { z.textContent = ''; zeiten(t, tag).forEach(function (s) { z.appendChild(el('span', null, s)); }); };
    zeige(null);
    eintraege.push({ el: li, t: t, liste: 'kino', zeige: zeige });
  });
  if ((a.kino || []).length) document.getElementById('kino-sec').hidden = false;
  // Filter: Tag (Sa/So) plus Schlagworte aus "tags" und automatisch aus Kosten, Reiz und Weg
  var FILTER = [['kostenlos','Kostenlos'],['sport','Sportlich'],['ruhig','Ruhig'],['laut','Laut'],['drinnen','Drinnen'],['draussen','Draußen'],['nah','Nah'],['rollt','Züge & Rollen'],['musik','Musik'],['neu','Neu entdecken']];
  function schlagworte(t) {
    var s = (t.tags || []).slice();
    if (t.frei || /^kostenlos/i.test(t.kosten || '')) s.push('kostenlos');
    if (t.reiz === 'gruen') s.push('ruhig'); if (t.reiz === 'rot') s.push('laut');
    if (t.weg && t.weg.art === 'nah') s.push('nah');
    if (/neu entdecken/i.test(t.hinweis || '')) s.push('neu');
    return s;
  }
  eintraege.forEach(function (e) { e.s = schlagworte(e.t); e.tage = tage(e.t); });
  var aktiv = [], tag = null;
  var reihe = document.getElementById('filter-reihe'), tagReihe = document.getElementById('tag-reihe'), info = document.getElementById('filter-info');
  var vorhanden = FILTER.filter(function (f) { return eintraege.some(function (e) { return e.s.indexOf(f[0]) >= 0; }); });
  function anwenden() {
    var n = 0;
    eintraege.forEach(function (e) {
      var ok = aktiv.every(function (k) { return e.s.indexOf(k) >= 0; }) && (!tag || e.tage.indexOf(tag) >= 0);
      e.el.hidden = !ok; if (ok) n++;
      e.zeige(tag);
    });
    [['top', 'top-sec'], ['mehr', 'mehr-sec'], ['kino', 'kino-sec']].forEach(function (p) {
      var sec = document.getElementById(p[1]), hat = eintraege.some(function (e) { return e.liste === p[0]; });
      if (hat) sec.hidden = !eintraege.some(function (e) { return e.liste === p[0] && !e.el.hidden; });
    });
    info.textContent = '';
    if (aktiv.length || tag) {
      info.appendChild(document.createTextNode(n ? n + ' von ' + eintraege.length + ' Tipps passen · ' : 'Nichts passt zu dieser Kombination · '));
      var b = el('button', null, 'alle zeigen'); b.type = 'button';
      b.onclick = function () {
        aktiv = []; tag = null;
        Array.prototype.forEach.call(reihe.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
        Array.prototype.forEach.call(tagReihe.children, function (c, i) { c.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
        anwenden();
      };
      info.appendChild(b);
    }
  }
  var hatSa = eintraege.some(function (e) { return e.tage.indexOf('sa') >= 0; }), hatSo = eintraege.some(function (e) { return e.tage.indexOf('so') >= 0; });
  if (hatSa && hatSo) {
    [[null, 'Beide Tage'], ['sa', 'Samstag'], ['so', 'Sonntag']].forEach(function (f, i) {
      var b = el('button', 'fchip', f[1]); b.type = 'button'; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.onclick = function () {
        tag = f[0];
        Array.prototype.forEach.call(tagReihe.children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
        anwenden();
      };
      tagReihe.appendChild(b);
    });
    tagReihe.hidden = false;
    document.getElementById('filter').hidden = false;
  }
  if (vorhanden.length > 1) {
    vorhanden.forEach(function (f) {
      var b = el('button', 'fchip', f[1]); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.onclick = function () {
        var i = aktiv.indexOf(f[0]); if (i >= 0) aktiv.splice(i, 1); else aktiv.push(f[0]);
        b.setAttribute('aria-pressed', i >= 0 ? 'false' : 'true'); anwenden();
      };
      reihe.appendChild(b);
    });
    document.getElementById('filter').hidden = false;
  }
  var ar = document.getElementById('archiv');
  (d.archiv || []).forEach(function (w) {
    var b = el('div'); b.appendChild(el('h4', null, w.titel)); var ul = el('ul');
    (w.tipps || []).forEach(function (t) { ul.appendChild(el('li', null, t)); }); b.appendChild(ul); ar.appendChild(b);
  });
  if (!(d.archiv || []).length) document.getElementById('archiv-box').hidden = true;
  document.getElementById('stand').textContent = a.stand ? 'Stand: ' + a.stand + (a.quellen ? ' · ' + a.quellen : '') : '';
})();
